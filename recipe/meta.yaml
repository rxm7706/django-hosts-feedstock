{% set name = "django-hosts" %}
{% set version = "7.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 08006bc09f5af69638721ced0657f24044835a22a608732ee1004adc9c95fb7c

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools-scm
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - django >=3.2

test:
  imports:
    - django_hosts
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://django-hosts.readthedocs.io/
  summary: Dynamic and static host resolving for Django. Maps hostnames to URLconfs.
  dev_url: https://github.com/jazzband/django-hosts
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
